[workspace]
members = [
    "crates/dcc-cua-browser",
    "crates/dcc-cua-client",
    "crates/dcc-cua-core",
    "crates/dcc-cua-e2e",
    "crates/dcc-cua-host",
    "crates/dcc-cua-indicator",
    "crates/dcc-cua-interrupt",
    "crates/dcc-cua-platform-windows",
    "crates/dcc-cua-protocol",
    "crates/dcc-cua-profiles",
    "crates/dcc-cua-showcase",
    "crates/dcc-cua-shm",
    "crates/dcc-cua-semantic-profiles",
    "crates/dcc-cua-cli",
    "crates/dcc-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "1.19.3"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-cua"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"

# Keep the SDK, platform adapters, cursor renderer and testkit on one revision.
#
# The compatibility fork retains browser contracts that upstream trycua/cua has
# not merged: `scope_ancestor_role` / `scope_anchor` ancestor-scoped semantic
# snapshots and the `browser_scope_unavailable` refusal code. Upstream
# The fork also retains DCC-specific safety fixes; the sync candidate must
# verify those contracts before moving back to an unmodified upstream source.
#
# This revision adds native peer-window binding proofs to the Driver 0.49.1 fork.
# Compatibility and native acceptance remain subject to verification.
# See docs/design/sdk-dependency-maintenance.md for migration and acceptance.
cua-driver-contract = { git = "https://github.com/loonghao/cua.git", rev = "e8ae216a61bf07b7c5dc51b7bcb1c4146cc31e4f" }
cua-driver-sdk = { git = "https://github.com/loonghao/cua.git", rev = "e8ae216a61bf07b7c5dc51b7bcb1c4146cc31e4f" }
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "e8ae216a61bf07b7c5dc51b7bcb1c4146cc31e4f" }
cursor-overlay = { git = "https://github.com/loonghao/cua.git", rev = "e8ae216a61bf07b7c5dc51b7bcb1c4146cc31e4f" }
platform-macos = { git = "https://github.com/loonghao/cua.git", rev = "e8ae216a61bf07b7c5dc51b7bcb1c4146cc31e4f" }
platform-windows = { git = "https://github.com/loonghao/cua.git", rev = "e8ae216a61bf07b7c5dc51b7bcb1c4146cc31e4f" }
