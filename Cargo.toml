[workspace]
members = [
    "crates/dcc-cua-browser",
    "crates/dcc-cua-client",
    "crates/dcc-cua-core",
    "crates/dcc-cua-e2e",
    "crates/dcc-cua-host",
    "crates/dcc-cua-indicator",
    "crates/dcc-cua-interrupt",
    "crates/dcc-cua-platform-windows",
    "crates/dcc-cua-protocol",
    "crates/dcc-cua-profiles",
    "crates/dcc-cua-showcase",
    "crates/dcc-cua-shm",
    "crates/dcc-cua-semantic-profiles",
    "crates/dcc-cua-cli",
    "crates/dcc-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "1.12.2"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-cua"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"

# Keep the SDK, platform adapters, cursor renderer and testkit on one revision.
#
# The compatibility fork retains browser contracts that upstream trycua/cua has
# not merged: `scope_ancestor_role` / `scope_anchor` ancestor-scoped semantic
# snapshots and the `browser_scope_unavailable` refusal code. Upstream
# cua-driver-rs-v0.36.0 does not contain them, so the pin
# cannot move back to upstream until those contracts land there.
#
# This revision retains the required fork contracts on the official Driver 0.36.0
# release (6d6c734c127025fb39ad5d585a10382808b39dc1), including unmerged fixes.
# See docs/design/sdk-dependency-maintenance.md for migration and acceptance.
cua-driver-contract = { git = "https://github.com/loonghao/cua.git", rev = "55ab9c62fe23b87d015136f45c4e8995e9988615" }
cua-driver-sdk = { git = "https://github.com/loonghao/cua.git", rev = "55ab9c62fe23b87d015136f45c4e8995e9988615" }
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "55ab9c62fe23b87d015136f45c4e8995e9988615" }
cursor-overlay = { git = "https://github.com/loonghao/cua.git", rev = "55ab9c62fe23b87d015136f45c4e8995e9988615" }
platform-macos = { git = "https://github.com/loonghao/cua.git", rev = "55ab9c62fe23b87d015136f45c4e8995e9988615" }
platform-windows = { git = "https://github.com/loonghao/cua.git", rev = "55ab9c62fe23b87d015136f45c4e8995e9988615" }
