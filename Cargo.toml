[workspace]
members = [
    "crates/dcc-cua-browser",
    "crates/dcc-cua-client",
    "crates/dcc-cua-core",
    "crates/dcc-cua-e2e",
    "crates/dcc-cua-host",
    "crates/dcc-cua-indicator",
    "crates/dcc-cua-interrupt",
    "crates/dcc-cua-platform-windows",
    "crates/dcc-cua-protocol",
    "crates/dcc-cua-profiles",
    "crates/dcc-cua-showcase",
    "crates/dcc-cua-shm",
    "crates/dcc-cua-semantic-profiles",
    "crates/dcc-cua-cli",
    "crates/dcc-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "1.21.0"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-cua"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"

# Keep the SDK, platform adapters, cursor renderer and testkit on one revision.
#
# Use the latest published Try CUA Driver release as one immutable source for
# runtime, platform adapters, cursor rendering and testkit. DCC-specific
# contracts must be verified against each upstream release before adoption.
#
# Driver 0.59.5 is pinned by release commit, not a moving branch or tag.
# See docs/design/sdk-dependency-maintenance.md for migration and acceptance.
cua-driver-contract = { git = "https://github.com/trycua/cua.git", rev = "181227e2afb100979d5d507715ffc15b5ee9b747" }
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "181227e2afb100979d5d507715ffc15b5ee9b747" }
cua-driver-testkit = { git = "https://github.com/trycua/cua.git", rev = "181227e2afb100979d5d507715ffc15b5ee9b747" }
cursor-overlay = { git = "https://github.com/trycua/cua.git", rev = "181227e2afb100979d5d507715ffc15b5ee9b747" }
platform-macos = { git = "https://github.com/trycua/cua.git", rev = "181227e2afb100979d5d507715ffc15b5ee9b747" }
platform-windows = { git = "https://github.com/trycua/cua.git", rev = "181227e2afb100979d5d507715ffc15b5ee9b747" }
