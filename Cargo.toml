[workspace]
members = [
    "crates/dcc-cua-browser",
    "crates/dcc-cua-client",
    "crates/dcc-cua-core",
    "crates/dcc-cua-e2e",
    "crates/dcc-cua-host",
    "crates/dcc-cua-indicator",
    "crates/dcc-cua-interrupt",
    "crates/dcc-cua-platform-windows",
    "crates/dcc-cua-protocol",
    "crates/dcc-cua-profiles",
    "crates/dcc-cua-showcase",
    "crates/dcc-cua-shm",
    "crates/dcc-cua-semantic-profiles",
    "crates/dcc-cua-cli",
    "crates/dcc-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "1.8.3"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-cua"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"

# Keep the SDK, platform adapters, cursor renderer and testkit on one revision.
# The compatibility fork retains browser contracts not yet merged upstream.
cua-driver-contract = { git = "https://github.com/loonghao/cua.git", rev = "044448f4cf46b9777c63df0d5a07d4432674b46e" }
cua-driver-sdk = { git = "https://github.com/loonghao/cua.git", rev = "044448f4cf46b9777c63df0d5a07d4432674b46e" }
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "044448f4cf46b9777c63df0d5a07d4432674b46e" }
cursor-overlay = { git = "https://github.com/loonghao/cua.git", rev = "044448f4cf46b9777c63df0d5a07d4432674b46e" }
platform-macos = { git = "https://github.com/loonghao/cua.git", rev = "044448f4cf46b9777c63df0d5a07d4432674b46e" }
platform-windows = { git = "https://github.com/loonghao/cua.git", rev = "044448f4cf46b9777c63df0d5a07d4432674b46e" }
