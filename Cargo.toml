[workspace]
members = [
    "crates/dcc-cua-browser",
    "crates/dcc-cua-client",
    "crates/dcc-cua-core",
    "crates/dcc-cua-e2e",
    "crates/dcc-cua-host",
    "crates/dcc-cua-indicator",
    "crates/dcc-cua-interrupt",
    "crates/dcc-cua-platform-windows",
    "crates/dcc-cua-protocol",
    "crates/dcc-cua-profiles",
    "crates/dcc-cua-showcase",
    "crates/dcc-cua-shm",
    "crates/dcc-cua-semantic-profiles",
    "crates/dcc-cua-cli",
    "crates/dcc-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "1.22.0"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-cua"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"

# Keep the SDK, platform adapters, cursor renderer and testkit on one revision.
#
# Use one immutable Try CUA upstream revision for the runtime, platform
# adapters, cursor rendering and testkit. DCC-specific contracts must be
# verified against each upstream revision before adoption.
#
# The revision is pinned explicitly instead of following a moving branch.
# See docs/design/sdk-dependency-maintenance.md for migration and acceptance.
cua-driver-contract = { git = "https://github.com/trycua/cua.git", rev = "cb4f8dbe279c9f815efdef888ec938fb89bab8d6" }
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "cb4f8dbe279c9f815efdef888ec938fb89bab8d6" }
cua-driver-testkit = { git = "https://github.com/trycua/cua.git", rev = "cb4f8dbe279c9f815efdef888ec938fb89bab8d6" }
cursor-overlay = { git = "https://github.com/trycua/cua.git", rev = "cb4f8dbe279c9f815efdef888ec938fb89bab8d6" }
platform-macos = { git = "https://github.com/trycua/cua.git", rev = "cb4f8dbe279c9f815efdef888ec938fb89bab8d6" }
platform-windows = { git = "https://github.com/trycua/cua.git", rev = "cb4f8dbe279c9f815efdef888ec938fb89bab8d6" }
