[workspace]
members = [
    "crates/dcc-cua-browser",
    "crates/dcc-cua-client",
    "crates/dcc-cua-core",
    "crates/dcc-cua-e2e",
    "crates/dcc-cua-host",
    "crates/dcc-cua-indicator",
    "crates/dcc-cua-interrupt",
    "crates/dcc-cua-platform-windows",
    "crates/dcc-cua-protocol",
    "crates/dcc-cua-profiles",
    "crates/dcc-cua-showcase",
    "crates/dcc-cua-shm",
    "crates/dcc-cua-semantic-profiles",
    "crates/dcc-cua-cli",
    "crates/dcc-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "1.9.1"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-cua"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"

# Keep the SDK, platform adapters, cursor renderer and testkit on one revision.
#
# The compatibility fork retains browser contracts that upstream trycua/cua has
# not merged: `scope_ancestor_role` / `scope_anchor` ancestor-scoped semantic
# snapshots and the `browser_scope_unavailable` refusal code. Upstream
# cua-driver-rs-v0.28.2 and upstream main contain none of them, so the pin
# cannot move back to upstream until those contracts land there.
#
# This revision is the fork-only delta replayed verbatim on top of the official
# upstream release tag `cua-driver-rs-v0.28.2` (commit fc188250b4ca8549b8e61f937fdb1fb560770e86).
cua-driver-contract = { git = "https://github.com/loonghao/cua.git", rev = "3d2bcf50089ea18aa5bedab328b1afb3f710ea00" }
cua-driver-sdk = { git = "https://github.com/loonghao/cua.git", rev = "3d2bcf50089ea18aa5bedab328b1afb3f710ea00" }
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "3d2bcf50089ea18aa5bedab328b1afb3f710ea00" }
cursor-overlay = { git = "https://github.com/loonghao/cua.git", rev = "3d2bcf50089ea18aa5bedab328b1afb3f710ea00" }
platform-macos = { git = "https://github.com/loonghao/cua.git", rev = "3d2bcf50089ea18aa5bedab328b1afb3f710ea00" }
platform-windows = { git = "https://github.com/loonghao/cua.git", rev = "3d2bcf50089ea18aa5bedab328b1afb3f710ea00" }
