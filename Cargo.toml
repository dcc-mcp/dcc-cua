[workspace]
members = [
    "crates/dcc-mcp-cua-browser",
    "crates/dcc-mcp-cua-client",
    "crates/dcc-mcp-cua-core",
    "crates/dcc-mcp-cua-e2e",
    "crates/dcc-mcp-cua-host",
    "crates/dcc-mcp-cua-indicator",
    "crates/dcc-mcp-cua-platform-windows",
    "crates/dcc-mcp-cua-protocol",
    "crates/dcc-mcp-cua-shm",
    "crates/dcc-mcp-cua-semantic-profiles",
    "crates/dcc-mcp-cua-cli",
    "crates/dcc-mcp-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-mcp-computer-use"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"
