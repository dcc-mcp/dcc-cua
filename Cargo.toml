[workspace]
members = [
    "crates/dcc-cua-browser",
    "crates/dcc-cua-client",
    "crates/dcc-cua-core",
    "crates/dcc-cua-e2e",
    "crates/dcc-cua-host",
    "crates/dcc-cua-indicator",
    "crates/dcc-cua-interrupt",
    "crates/dcc-cua-platform-windows",
    "crates/dcc-cua-protocol",
    "crates/dcc-cua-profiles",
    "crates/dcc-cua-showcase",
    "crates/dcc-cua-shm",
    "crates/dcc-cua-semantic-profiles",
    "crates/dcc-cua-cli",
    "crates/dcc-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "1.9.3"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-cua"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"

# Keep the SDK, platform adapters, cursor renderer and testkit on one revision.
# This compatibility candidate uses SDK 0.33.2, based on official upstream
# trycua/cua@c82d32e3e1adbc6578a148962002ddf6e3e8a15a. The fork retains the
# ancestor-scoped browser contract and consent/navigation compatibility fixes.
# Source review: https://github.com/loonghao/cua/pull/5 (draft).
# See docs/design/sdk-dependency-maintenance.md for outstanding acceptance gates.
cua-driver-contract = { git = "https://github.com/loonghao/cua.git", rev = "7ce18efd2489c29244235481fb547e013f0f4c14" }
cua-driver-sdk = { git = "https://github.com/loonghao/cua.git", rev = "7ce18efd2489c29244235481fb547e013f0f4c14" }
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "7ce18efd2489c29244235481fb547e013f0f4c14" }
cursor-overlay = { git = "https://github.com/loonghao/cua.git", rev = "7ce18efd2489c29244235481fb547e013f0f4c14" }
platform-macos = { git = "https://github.com/loonghao/cua.git", rev = "7ce18efd2489c29244235481fb547e013f0f4c14" }
platform-windows = { git = "https://github.com/loonghao/cua.git", rev = "7ce18efd2489c29244235481fb547e013f0f4c14" }
