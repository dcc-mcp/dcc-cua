[workspace]
members = [
    "crates/dcc-cua-browser",
    "crates/dcc-cua-client",
    "crates/dcc-cua-core",
    "crates/dcc-cua-e2e",
    "crates/dcc-cua-host",
    "crates/dcc-cua-indicator",
    "crates/dcc-cua-platform-windows",
    "crates/dcc-cua-protocol",
    "crates/dcc-cua-shm",
    "crates/dcc-cua-semantic-profiles",
    "crates/dcc-cua-cli",
    "crates/dcc-cua-workspace-hack",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
publish = false
authors = ["loonghao <hal.long@outlook.com>"]
license = "MIT"
repository = "https://github.com/dcc-mcp/dcc-cua"

[workspace.dependencies]
async-trait = "0.1"
rstest = "0.26.1"
