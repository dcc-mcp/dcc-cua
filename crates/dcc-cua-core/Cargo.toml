[package]
name = "dcc-cua-core"
description = "Scoped Computer Use domain and CUA execution boundary"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
# Upstreamed Windows discovery and foreground-input fixes: https://github.com/trycua/cua/pull/2812
cua-driver-contract = { git = "https://github.com/trycua/cua.git", rev = "441cae0d4d4048524ce2f7eeabfb63a6c9a422d3", package = "cua-driver-contract" }
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "441cae0d4d4048524ce2f7eeabfb63a6c9a422d3", package = "cua-driver-sdk" }
cursor-overlay = { git = "https://github.com/trycua/cua.git", rev = "441cae0d4d4048524ce2f7eeabfb63a6c9a422d3", package = "cursor-overlay" }
dcc-cua-indicator = { path = "../dcc-cua-indicator" }
mp4 = "0.14"
openh264 = "0.9.7"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
dcc-cua-workspace-hack = { version = "0.5.1", path = "../dcc-cua-workspace-hack" }

[target.'cfg(windows)'.dependencies]
dcc-cua-platform-windows = { path = "../dcc-cua-platform-windows" }
platform-windows = { git = "https://github.com/trycua/cua.git", rev = "441cae0d4d4048524ce2f7eeabfb63a6c9a422d3", package = "platform-windows" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { git = "https://github.com/trycua/cua.git", rev = "441cae0d4d4048524ce2f7eeabfb63a6c9a422d3", package = "platform-macos" }

[dev-dependencies]
rstest.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
