[package]
name = "dcc-cua-core"
description = "Scoped Computer Use domain and CUA execution boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_core"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
base64 = "0.22"
cua-driver-contract.workspace = true
cua-driver-sdk.workspace = true
cursor-overlay.workspace = true
dcc-cua-indicator = { path = "../dcc-cua-indicator" }
dcc-cua-interrupt = { path = "../dcc-cua-interrupt" }
dcc-cua-protocol = { path = "../dcc-cua-protocol" }
dcc-cua-showcase = { path = "../dcc-cua-showcase" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
dcc-cua-workspace-hack = { version = "1", path = "../dcc-cua-workspace-hack" }

[target.'cfg(windows)'.dependencies]
dcc-cua-platform-windows = { path = "../dcc-cua-platform-windows" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos.workspace = true

[dev-dependencies]
async-trait.workspace = true
rstest.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
