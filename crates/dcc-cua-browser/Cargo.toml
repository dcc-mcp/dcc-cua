[package]
name = "dcc-cua-browser"
description = "Exact-window typed browser adapter for dcc-cua"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_browser"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
dcc-cua-core = { path = "../dcc-cua-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dcc-cua-workspace-hack = { version = "0.3.0", path = "../dcc-cua-workspace-hack" }

[dev-dependencies]
rstest.workspace = true
