[package]
name = "dcc-cua-protocol"
description = "Shared wire and local endpoint contract for the CUA Host"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_protocol"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_RemoteDesktop", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rstest.workspace = true

[dependencies]
dcc-cua-workspace-hack = { version = "0.3.0", path = "../dcc-cua-workspace-hack" }
