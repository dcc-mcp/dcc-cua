[package]
name = "dcc-cua-client"
description = "Cross-platform client for dcc-cua Host IPC"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_client"
path = "src/lib.rs"

[dependencies]
dcc-cua-protocol = { path = "../dcc-cua-protocol" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
dcc-cua-workspace-hack = { version = "0.3.0", path = "../dcc-cua-workspace-hack" }

[dev-dependencies]
rstest.workspace = true
