[package]
name = "dcc-mcp-cua-e2e"
description = "Controlled cross-platform GUI end-to-end tests for DCC-MCP CUA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
gui-e2e = []

[dev-dependencies]
cua-driver-testkit = { git = "https://github.com/trycua/cua.git", rev = "dc0af9b23ca8d866540b9ed2b4e4ad7b8b0c4ffb", package = "cua-driver-testkit" }
dcc-mcp-cua-client = { path = "../dcc-mcp-cua-client" }
rstest.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
