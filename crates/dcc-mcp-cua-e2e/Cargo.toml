[package]
name = "dcc-mcp-cua-e2e"
description = "Controlled cross-platform GUI end-to-end tests for DCC-MCP CUA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
gui-e2e = []

[dev-dependencies]
# Temporary upstream fix: https://github.com/trycua/cua/pull/2812
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "bed06d8bb144ff673fbdc8181ec42dc134d2de91", package = "cua-driver-testkit" }
dcc-mcp-cua-client = { path = "../dcc-mcp-cua-client" }
rstest.workspace = true
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
