[package]
name = "dcc-mcp-cua-e2e"
description = "Controlled cross-platform GUI end-to-end tests for DCC-MCP CUA"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
gui-e2e = []

[dev-dependencies]
# Temporary upstream fix: https://github.com/trycua/cua/pull/2812
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "e96f0ce2b45ea94684fa82acba0b21d91408942a", package = "cua-driver-testkit" }
dcc-mcp-cua-client = { path = "../dcc-mcp-cua-client" }
rstest.workspace = true
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
dcc-mcp-cua-workspace-hack = { version = "0.0.0", path = "../dcc-mcp-cua-workspace-hack" }
