[package]
name = "dcc-mcp-cua-host"
description = "Versioned local Host IPC for DCC-MCP Computer Use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_mcp_cua_host"
path = "src/lib.rs"

[dependencies]
dcc-mcp-cua-browser = { path = "../dcc-mcp-cua-browser" }
dcc-mcp-cua-core = { path = "../dcc-mcp-cua-core" }
dcc-mcp-cua-shm = { path = "../dcc-mcp-cua-shm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_RemoteDesktop", "Win32_System_Threading"] }
