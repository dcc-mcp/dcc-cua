[package]
name = "dcc-cua-host"
description = "Versioned local Host IPC for dcc-cua"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_host"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
dcc-cua-browser = { path = "../dcc-cua-browser" }
dcc-cua-core = { path = "../dcc-cua-core" }
dcc-cua-indicator = { path = "../dcc-cua-indicator" }
dcc-cua-protocol = { path = "../dcc-cua-protocol" }
dcc-cua-shm = { path = "../dcc-cua-shm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
dcc-cua-workspace-hack = { version = "1.3.0", path = "../dcc-cua-workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
rstest.workspace = true
