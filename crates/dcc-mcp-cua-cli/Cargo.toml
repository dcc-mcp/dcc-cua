[package]
name = "dcc-mcp-cua-cli"
description = "DCC-MCP Computer Use command-line host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dcc-mcp-cua"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
dcc-mcp-cua-client = { path = "../dcc-mcp-cua-client" }
dcc-mcp-cua-core = { path = "../dcc-mcp-cua-core" }
dcc-mcp-cua-host = { path = "../dcc-mcp-cua-host" }
dcc-mcp-cua-semantic-profiles = { path = "../dcc-mcp-cua-semantic-profiles" }
dcc-mcp-cua-shm = { path = "../dcc-mcp-cua-shm" }
serde_json = "1"
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
dcc-mcp-cua-workspace-hack = { version = "0.0.0", path = "../dcc-mcp-cua-workspace-hack" }

[dev-dependencies]
rstest.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
