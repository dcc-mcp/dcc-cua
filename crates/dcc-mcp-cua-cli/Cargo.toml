[package]
name = "dcc-mcp-cua-cli"
description = "DCC-MCP Computer Use command-line host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dcc-mcp-cua"
path = "src/main.rs"

[dependencies]
dcc-mcp-cua-core = { path = "../dcc-mcp-cua-core" }
dcc-mcp-cua-host = { path = "../dcc-mcp-cua-host" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
