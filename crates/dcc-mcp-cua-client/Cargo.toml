[package]
name = "dcc-mcp-cua-client"
description = "Cross-platform client for the DCC-MCP Computer Use Host IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_mcp_cua_client"
path = "src/lib.rs"

[dependencies]
dcc-mcp-cua-protocol = { path = "../dcc-mcp-cua-protocol" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
dcc-mcp-cua-workspace-hack = { version = "0.0.0", path = "../dcc-mcp-cua-workspace-hack" }

[dev-dependencies]
rstest.workspace = true
