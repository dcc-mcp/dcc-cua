[package]
name = "dcc-cua-shm"
description = "Cross-platform shared-memory image handoff for dcc-cua"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_shm"
path = "src/lib.rs"

[dependencies]
# Temporary upstream fix: https://github.com/loonghao/ipckit/pull/80
ipckit = { git = "https://github.com/loonghao/ipckit.git", rev = "e2a0abc8dd7ce9f88f2d07b1923770bf7af09761" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dcc-cua-workspace-hack = { version = "0.3.0", path = "../dcc-cua-workspace-hack" }

[dev-dependencies]
rstest.workspace = true
