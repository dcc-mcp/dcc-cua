[package]
name = "dcc-cua-shm"
description = "Cross-platform shared-memory image handoff for dcc-cua"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_shm"
path = "src/lib.rs"

[dependencies]
ipckit = "0.1.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dcc-cua-workspace-hack = { version = "1.2.0", path = "../dcc-cua-workspace-hack" }

[dev-dependencies]
rstest.workspace = true
