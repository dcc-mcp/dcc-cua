[package]
name = "dcc-cua-profiles"
description = "Reusable profile package, catalog, and knowledge context services for dcc-cua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_cua_profiles"
path = "src/lib.rs"

[dependencies]
dcc-cua-semantic-profiles = { path = "../dcc-cua-semantic-profiles" }
dcc-cua-workspace-hack = { path = "../dcc-cua-workspace-hack" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
jsonschema = "0.46"
rstest.workspace = true
tempfile = "3"
