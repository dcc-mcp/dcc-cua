[package]
name = "dcc-cua-indicator"
description = "Visible control-session banner for dcc-cua hosts"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
include = ["Cargo.toml", "build.rs", "src/**", "theme/**"]

[lib]
name = "dcc_cua_indicator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
dcc-cua-workspace-hack = { version = "0.5.0", path = "../dcc-cua-workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rstest.workspace = true
serde_json = "1"

[build-dependencies]
serde_json = "1"
