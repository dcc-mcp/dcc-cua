[package]
name = "dcc-cua-e2e"
description = "Controlled cross-platform GUI end-to-end tests for dcc-cua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
gui-e2e = []

[dev-dependencies]
# Keep E2E on the exact fork candidate used by the runtime crates.
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "39f8a1a976f9e87d8d28affb74a1c87368893ca5", package = "cua-driver-testkit" }
dcc-cua-client = { path = "../dcc-cua-client" }
rstest.workspace = true
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dev-dependencies]
dcc-cua-core = { path = "../dcc-cua-core" }
dcc-cua-indicator = { path = "../dcc-cua-indicator" }
dcc-cua-platform-windows = { path = "../dcc-cua-platform-windows" }
png = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
dcc-cua-workspace-hack = { version = "1", path = "../dcc-cua-workspace-hack" }
