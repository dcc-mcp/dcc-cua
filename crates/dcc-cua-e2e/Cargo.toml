[package]
name = "dcc-cua-e2e"
description = "Controlled cross-platform GUI end-to-end tests for dcc-cua"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
gui-e2e = []

[dev-dependencies]
# Upstreamed Windows discovery and foreground-input fixes: https://github.com/trycua/cua/pull/2812
cua-driver-testkit = { git = "https://github.com/trycua/cua.git", rev = "441cae0d4d4048524ce2f7eeabfb63a6c9a422d3", package = "cua-driver-testkit" }
dcc-cua-client = { path = "../dcc-cua-client" }
rstest.workspace = true
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
dcc-cua-workspace-hack = { version = "0.3.0", path = "../dcc-cua-workspace-hack" }
