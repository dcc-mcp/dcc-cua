[package]
name = "dcc-cua-e2e"
description = "Controlled cross-platform GUI end-to-end tests for dcc-cua"
version = "1.3.2"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
gui-e2e = []

[dev-dependencies]
# Keep E2E on the exact fork candidate used by the runtime crates.
cua-driver-testkit = { git = "https://github.com/loonghao/cua.git", rev = "05676a31f173812e04772536478be4495ea22285", package = "cua-driver-testkit" }
dcc-cua-client = { path = "../dcc-cua-client" }
rstest.workspace = true
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dev-dependencies]
dcc-cua-platform-windows = { path = "../dcc-cua-platform-windows" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
dcc-cua-workspace-hack = { version = "1.3.2", path = "../dcc-cua-workspace-hack" }
