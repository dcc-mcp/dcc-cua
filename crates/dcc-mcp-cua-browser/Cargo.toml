[package]
name = "dcc-mcp-cua-browser"
description = "Exact-window typed browser adapter for DCC-MCP CUA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_mcp_cua_browser"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
dcc-mcp-cua-core = { path = "../dcc-mcp-cua-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
