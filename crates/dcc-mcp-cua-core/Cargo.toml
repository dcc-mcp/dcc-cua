[package]
name = "dcc-mcp-cua-core"
description = "Scoped Computer Use domain and CUA execution boundary for DCC-MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_mcp_cua_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "dc0af9b23ca8d866540b9ed2b4e4ad7b8b0c4ffb", package = "cua-driver-sdk" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
rstest.workspace = true
