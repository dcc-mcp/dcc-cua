[package]
name = "dcc-mcp-cua-core"
description = "Scoped Computer Use domain and CUA execution boundary for DCC-MCP"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dcc_mcp_cua_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
# Temporary upstream fix: https://github.com/trycua/cua/pull/2812
cua-driver-contract = { git = "https://github.com/loonghao/cua.git", rev = "e96f0ce2b45ea94684fa82acba0b21d91408942a", package = "cua-driver-contract" }
cua-driver-sdk = { git = "https://github.com/loonghao/cua.git", rev = "e96f0ce2b45ea94684fa82acba0b21d91408942a", package = "cua-driver-sdk" }
cursor-overlay = { git = "https://github.com/loonghao/cua.git", rev = "e96f0ce2b45ea94684fa82acba0b21d91408942a", package = "cursor-overlay" }
dcc-mcp-cua-indicator = { path = "../dcc-mcp-cua-indicator" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
dcc-mcp-cua-workspace-hack = { version = "0.1.0", path = "../dcc-mcp-cua-workspace-hack" }

[target.'cfg(windows)'.dependencies]
dcc-mcp-cua-platform-windows = { path = "../dcc-mcp-cua-platform-windows" }
platform-windows = { git = "https://github.com/loonghao/cua.git", rev = "e96f0ce2b45ea94684fa82acba0b21d91408942a", package = "platform-windows" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
rstest.workspace = true
