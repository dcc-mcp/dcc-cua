<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: transparent; color: CanvasText; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 14px; padding: 16px; }
    h2 { margin: 0 0 6px; font-size: 18px; }
    .subtitle, .hint { color: color-mix(in srgb, CanvasText 68%, transparent); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 14px 0; }
    dt { font-weight: 650; }
    dd { margin: 0; overflow-wrap: anywhere; }
    ul { margin: 8px 0 14px; padding-left: 20px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button { border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 650; cursor: pointer; }
    button.primary { background: #087cd8; color: white; }
    button.secondary { background: color-mix(in srgb, CanvasText 10%, transparent); color: CanvasText; }
    button:disabled { cursor: default; opacity: .5; }
    .status { margin-top: 12px; min-height: 20px; font-weight: 650; }
    .ok { color: #16803d; }
    .error { color: #c43b31; }
  </style>
</head>
<body>
  <section class="card" aria-labelledby="title">
    <h2 id="title">DCC-CUA 任务授权</h2>
    <div class="subtitle">确认范围后由当前 Agent 宿主完成授权；DCC-CUA 不再显示操作系统级二次确认。</div>
    <dl id="scope"></dl>
    <strong>允许的 Host 方法</strong>
    <ul id="methods"></ul>
    <strong>允许的敏感动作与风险范围</strong>
    <ul id="actions"></ul>
    <div class="hint">此卡片不收集密码、令牌或凭证。Agent 宿主负责用户审批，DCC-CUA 只签发并执行卡片中展示的精确范围。</div>
    <div class="actions">
      <button id="authorize" class="primary" type="button">授权并开始</button>
      <button id="revoke" class="secondary" type="button" disabled>撤销</button>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
  </section>
  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      let proposal = null;
      const output = () => window.openai?.toolOutput ?? null;
      const payloadFrom = (value) => value?.structuredContent ?? value?.result?.structuredContent ?? value;
      const text = (value) => String(value ?? "");
      const render = () => {
        const next = output();
        if (!next?.proposal_id) return;
        proposal = next;
        const target = next.target ?? {};
        const ownedBrowser = target.kind === "owned_browser";
        const rows = [
          ["Provider", `${text(next.provider)} ${text(next.runtime_version)}`],
          ["目标", ownedBrowser ? `${text(target.browser)} / ${text(target.profile)}（授权后由 DCC-CUA 派生）` : "exact_window"],
          ["PID", ownedBrowser ? "授权后派生" : text(target.process_id)],
          ["HWND", ownedBrowser ? "授权后派生" : `0x${Number(target.window_handle || 0).toString(16)}`],
          ["应用", text(next.application_label)],
          ["Surface", text(next.surface)],
          ["浏览器 Origins", (next.allowed_browser_origins ?? []).join(", ") || "无"],
          ["范围摘要", text(next.confirmation_digest_sha256)],
          ["到期", new Date(Number(next.expires_at_unix_ms)).toLocaleString()],
        ];
        byId("scope").replaceChildren(...rows.flatMap(([key, value]) => {
          const dt = document.createElement("dt"); dt.textContent = key;
          const dd = document.createElement("dd"); dd.textContent = value;
          return [dt, dd];
        }));
        byId("methods").replaceChildren(...(next.allowed_methods ?? []).map((method) => {
          const li = document.createElement("li"); li.textContent = method; return li;
        }));
        byId("actions").replaceChildren(...(next.allowed_actions ?? []).map((action) => {
          const li = document.createElement("li");
          const origin = action.browser_origin ? ` @ ${action.browser_origin}` : "";
          li.textContent = `${action.action} / ${action.input_kind} / ${action.authorization_category}${origin}`;
          return li;
        }));
      };
      const setStatus = (message, kind = "") => {
        byId("status").textContent = message;
        byId("status").className = `status ${kind}`;
      };
      const call = async (name, args) => {
        if (!window.openai?.callTool) throw new Error("当前宿主不支持 MCP Apps 工具调用；任务未授权。");
        return payloadFrom(await window.openai.callTool(name, args));
      };
      byId("authorize").addEventListener("click", async () => {
        if (!proposal) return setStatus("授权范围尚未加载。", "error");
        byId("authorize").disabled = true;
        setStatus("正在提交当前 Agent 宿主的授权…");
        try {
          const result = await call("authorize_task", { proposal_id: proposal.proposal_id });
          if (!result?.ok) throw new Error(result?.error || "授权失败");
          byId("revoke").disabled = false;
          setStatus("已授权，正在启动并派生精确目标…");
          const started = await call("start_authorized_task", { proposal_id: proposal.proposal_id });
          if (!started?.ok) throw new Error(started?.error || "任务启动失败");
          const pid = Number(started.target?.process_id || 0);
          const hwnd = Number(started.target?.window_handle || 0);
          if (!pid || !hwnd) throw new Error("任务启动未返回精确 PID/HWND");
          setStatus(`已启动：PID ${pid} / HWND 0x${hwnd.toString(16)}。任务范围内不会再出现原生动作弹框。`, "ok");
          await window.openai?.sendFollowUpMessage?.({
            prompt: `我已授权并启动 DCC-CUA 任务 ${proposal.proposal_id}。provider=${started.provider} runtime=${started.runtime_version} pid=${pid} hwnd=0x${hwnd.toString(16)}，请在该精确范围内继续。`,
            scrollToBottom: true,
          });
        } catch (error) {
          byId("authorize").disabled = false;
          setStatus(error?.message || String(error), "error");
        }
      });
      byId("revoke").addEventListener("click", async () => {
        if (!proposal) return;
        byId("revoke").disabled = true;
        try {
          const result = await call("revoke_task_authorization", { proposal_id: proposal.proposal_id });
          if (!result?.ok) throw new Error(result?.error || "撤销失败");
          setStatus("授权已撤销。后续动作会直接失败，不会回退到弹框。", "ok");
        } catch (error) {
          byId("revoke").disabled = false;
          setStatus(error?.message || String(error), "error");
        }
      });
      window.addEventListener("openai:set_globals", render, { passive: true });
      render();
    })();
  </script>
</body>
</html>
