[package]
name = "dcc-cua-cli"
description = "Cross-platform CUA command-line host"
version = "1.1.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dcc-cua"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
dcc-cua-client = { path = "../dcc-cua-client" }
dcc-cua-core = { path = "../dcc-cua-core" }
dcc-cua-host = { path = "../dcc-cua-host" }
dcc-cua-semantic-profiles = { path = "../dcc-cua-semantic-profiles" }
dcc-cua-shm = { path = "../dcc-cua-shm" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
dcc-cua-workspace-hack = { version = "1.1.1", path = "../dcc-cua-workspace-hack" }

[dev-dependencies]
rstest.workspace = true
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
