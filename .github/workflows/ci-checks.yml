name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select immutable CI source SHA
        id: ci-source
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$CI_EVENT_NAME" in
            pull_request) source_sha="$CI_PULL_REQUEST_HEAD_SHA" ;;
            push|workflow_dispatch) source_sha="$CI_EVENT_SHA" ;;
            *) echo "unsupported CI event: $CI_EVENT_NAME" >&2; exit 1 ;;
          esac
          case "$source_sha" in
            *[!0-9a-f]*|'') echo "CI event did not provide a lowercase commit SHA" >&2; exit 1 ;;
          esac
          if [ "${#source_sha}" -ne 40 ]; then
            echo "CI event did not provide a full commit SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ci-source.outputs.sha }}
          persist-credentials: false
      - name: Verify exact CI source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "checkout source identity mismatch" >&2
            exit 1
          fi
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/chrome/package-lock.json
      - name: Reverify immutable source before build
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
      - run: npm --prefix browser-extension/chrome ci
      - run: npm --prefix browser-extension/chrome run check
      - run: npm --prefix browser-extension/chrome test
      - run: npm --prefix browser-extension/chrome run build
      - run: python -B browser-extension/chrome/scripts/test_extension.py
      - name: Package deterministic browser artifacts
        shell: bash
        run: |
          set -euo pipefail
          for browser in chrome edge firefox; do
            python -B browser-extension/chrome/scripts/package_extension.py \
              --browser "$browser" \
              --output "dist/dcc-cua-browser-extension-${browser}.zip"
          done

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select immutable CI source SHA
        id: ci-source
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$CI_EVENT_NAME" in
            pull_request) source_sha="$CI_PULL_REQUEST_HEAD_SHA" ;;
            push|workflow_dispatch) source_sha="$CI_EVENT_SHA" ;;
            *) echo "unsupported CI event: $CI_EVENT_NAME" >&2; exit 1 ;;
          esac
          case "$source_sha" in
            *[!0-9a-f]*|'') echo "CI event did not provide a lowercase commit SHA" >&2; exit 1 ;;
          esac
          if [ "${#source_sha}" -ne 40 ]; then
            echo "CI event did not provide a full commit SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ci-source.outputs.sha }}
          persist-credentials: false
      - name: Verify exact CI source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "checkout source identity mismatch" >&2
            exit 1
          fi
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - name: Reverify immutable source before policy execution
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
      - run: pwsh -NoProfile -File scripts/check-rust-layout.ps1
      - run: pwsh -NoProfile -File scripts/check-agent-skills.ps1
      - run: python -B scripts/test_write_install_manifest.py
      - run: python -B -m unittest scripts.test_verify_release_assets
      - run: python -B -m unittest scripts.test_verify_final_archive
      - run: python -B -m unittest scripts.test_verify_uploaded_artifact
      - run: python -B -m unittest scripts.test_select_ci_source_sha
      - run: python -B -m unittest scripts.test_verify_ci_source_integrity
      - run: python -B -m unittest scripts.test_release_integrity
      - run: python -B -m unittest scripts.test_release_workflow
      - run: python -B -m unittest scripts.test_refresh_release_please_prs
      - run: python -B -m unittest scripts.test_browser_store_readiness
      - run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run
      - run: cargo fmt --all -- --check

  verify:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-26
            platform: macos-aarch64
            arch: arm64
          - os: macos-26-intel
            platform: macos-x86_64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Select immutable CI source SHA
        id: ci-source
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$CI_EVENT_NAME" in
            pull_request) source_sha="$CI_PULL_REQUEST_HEAD_SHA" ;;
            push|workflow_dispatch) source_sha="$CI_EVENT_SHA" ;;
            *) echo "unsupported CI event: $CI_EVENT_NAME" >&2; exit 1 ;;
          esac
          case "$source_sha" in
            *[!0-9a-f]*|'') echo "CI event did not provide a lowercase commit SHA" >&2; exit 1 ;;
          esac
          if [ "${#source_sha}" -ne 40 ]; then
            echo "CI event did not provide a full commit SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ci-source.outputs.sha }}
          persist-credentials: false
      - name: Verify exact CI source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "checkout source identity mismatch" >&2
            exit 1
          fi
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
      - if: startsWith(matrix.os, 'macos-')
        uses: ./.github/actions/select-macos-toolchain
        with:
          expected-arch: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-3-dev python3-gi gir1.2-gtk-3.0 libx11-dev libxi-dev libxtst-dev
      - if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_runtime="$(cd "$(dirname "$swiftc_path")/../lib/swift/macosx" && pwd)"
          echo "DYLD_LIBRARY_PATH=${swift_runtime}:/usr/lib/swift${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Reverify immutable source before build
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - if: matrix.os == 'windows-latest'
        run: python -B -m unittest scripts.test_indicator_acceptance_probe
      - name: Compile GUI E2E on every target
        run: cargo nextest run --locked -p dcc-cua-e2e --features gui-e2e --no-run

  e2e:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-26
            platform: macos-aarch64
            arch: arm64
          - os: macos-26-intel
            platform: macos-x86_64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Select immutable CI source SHA
        id: ci-source
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$CI_EVENT_NAME" in
            pull_request) source_sha="$CI_PULL_REQUEST_HEAD_SHA" ;;
            push|workflow_dispatch) source_sha="$CI_EVENT_SHA" ;;
            *) echo "unsupported CI event: $CI_EVENT_NAME" >&2; exit 1 ;;
          esac
          case "$source_sha" in
            *[!0-9a-f]*|'') echo "CI event did not provide a lowercase commit SHA" >&2; exit 1 ;;
          esac
          if [ "${#source_sha}" -ne 40 ]; then
            echo "CI event did not provide a full commit SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ci-source.outputs.sha }}
          persist-credentials: false
      - name: Verify exact CI source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "checkout source identity mismatch" >&2
            exit 1
          fi
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
      - if: startsWith(matrix.os, 'macos-')
        uses: ./.github/actions/select-macos-toolchain
        with:
          expected-arch: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb dbus-x11 at-spi2-core openbox picom libgtk-3-dev python3-gi gir1.2-gtk-3.0 libx11-dev libxi-dev libxtst-dev
      - if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_runtime="$(cd "$(dirname "$swiftc_path")/../lib/swift/macosx" && pwd)"
          echo "DYLD_LIBRARY_PATH=${swift_runtime}:/usr/lib/swift${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Reverify immutable source before build
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
      - run: cargo build --release --locked -p dcc-cua-cli
      - name: Run release CLI and Host IPC E2E
        timeout-minutes: 5
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { "target/release/dcc-cua.exe" } else { "target/release/dcc-cua" }
          ./scripts/test-cli-e2e.ps1 -Binary $binary
      - name: Run Windows controlled GUI Host IPC E2E
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: pwsh
        env:
          DCC_CUA_E2E_CLIPBOARD_WRITE: "1"
        run: ./scripts/run-gui-e2e.ps1 -Binary target/release/dcc-cua.exe
      - name: Run Linux controlled GUI Host IPC E2E
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -lc \
            'openbox >/tmp/dcc-cua-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/dcc-cua-picom.log 2>&1 & sleep 2; exec pwsh -NoProfile -File scripts/run-gui-e2e.ps1 -Binary target/release/dcc-cua'
      - name: Run macOS controlled GUI Host IPC E2E
        if: startsWith(matrix.os, 'macos-')
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/run-gui-e2e.ps1 -Binary target/release/dcc-cua
      - name: Package final native archive
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
        run: |
          set -euo pipefail
          git show "$EXPECTED_SOURCE_SHA:scripts/verify_ci_source_integrity.py" |
            python -B - --repository . --expected "$EXPECTED_SOURCE_SHA"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          mkdir -p dist
          rm -rf target/release/skills target/release/assets target/release/plugins target/release/.claude-plugin target/release/.codex-plugin
          cp -R skills target/release/skills
          cp -R assets target/release/assets
          cp -R plugins target/release/plugins
          cp -R .claude-plugin target/release/.claude-plugin
          cp -R .codex-plugin target/release/.codex-plugin
          cp .mcp.json target/release/.mcp.json
          cp LICENSE target/release/LICENSE
          cp THIRD_PARTY_LICENSES.md target/release/THIRD_PARTY_LICENSES.md
          cp README.md target/release/README.md
          cp README.zh-CN.md target/release/README.zh-CN.md
          case "$host" in
            x86_64-pc-windows-msvc)
              archive="dist/dcc-cua-${version}-${host}.zip"
              (
                cd target/release
                7z a "../../$archive" dcc-cua.exe LICENSE THIRD_PARTY_LICENSES.md README.md README.zh-CN.md assets skills plugins .claude-plugin .codex-plugin .mcp.json
              )
              ;;
            x86_64-unknown-linux-gnu|aarch64-apple-darwin|x86_64-apple-darwin)
              archive="dist/dcc-cua-${version}-${host}.tar.gz"
              tar -czf "$archive" -C target/release dcc-cua LICENSE THIRD_PARTY_LICENSES.md README.md README.zh-CN.md assets skills plugins .claude-plugin .codex-plugin .mcp.json
              ;;
            *)
              echo "unsupported PR-CI release host: $host" >&2
              exit 1
              ;;
          esac
          asset_name="$(basename "$archive")"
          manifest="dist/dcc-cua-install-manifest-${host}.json"
          python scripts/write-install-manifest.py \
            --archive "$archive" \
            --version "$version" \
            --target "$host" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${asset_name}" \
            --output "$manifest" \
            --checksum-output "${archive}.sha256" \
            --source-root target/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload-pr-native
        with:
          name: dcc-cua-pr-native-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - name: Download exact native artifact by ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload-pr-native.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-pr-native.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_ID" in
            ''|*[!0-9]*) echo "upload did not return a numeric artifact ID" >&2; exit 1 ;;
          esac
          case "$ARTIFACT_DIGEST" in
            *[!0-9a-f]*|'') echo "upload did not return a SHA-256 artifact digest" >&2; exit 1 ;;
          esac
          artifact_download_root="$RUNNER_TEMP/dcc-cua-pr-artifact-${ARTIFACT_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$artifact_download_root"
          artifact_metadata="$artifact_download_root/metadata.json"
          artifact_repository_metadata="$artifact_download_root/repository.json"
          artifact_bundle="$artifact_download_root/artifact.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "$artifact_metadata"
          gh api "repos/${GITHUB_REPOSITORY}" > "$artifact_repository_metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$artifact_bundle"
          printf 'ARTIFACT_METADATA=%s\nARTIFACT_REPOSITORY_METADATA=%s\nARTIFACT_BUNDLE=%s\n' \
            "$artifact_metadata" "$artifact_repository_metadata" "$artifact_bundle" >> "$GITHUB_ENV"
      - name: Verify downloaded immutable native artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload-pr-native.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-pr-native.outputs.artifact-digest }}
          EXPECTED_SOURCE_SHA: ${{ steps.ci-source.outputs.sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          case "$host" in
            x86_64-pc-windows-msvc) archive_name="dcc-cua-${version}-${host}.zip" ;;
            x86_64-unknown-linux-gnu|aarch64-apple-darwin|x86_64-apple-darwin) archive_name="dcc-cua-${version}-${host}.tar.gz" ;;
            *) echo "unsupported PR-CI release host: $host" >&2; exit 1 ;;
          esac
          manifest_name="dcc-cua-install-manifest-${host}.json"
          python -B scripts/verify_uploaded_artifact.py \
            --metadata "$ARTIFACT_METADATA" \
            --repository-metadata "$ARTIFACT_REPOSITORY_METADATA" \
            --bundle "$ARTIFACT_BUNDLE" \
            --output-root "$RUNNER_TEMP/dcc-cua-pr-readback-${ARTIFACT_ID}" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "dcc-cua-pr-native-${{ matrix.platform }}" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$EXPECTED_SOURCE_SHA" \
            --repository-id "$EXPECTED_REPOSITORY_ID" \
            --head-repository-id "$EXPECTED_HEAD_REPOSITORY_ID" \
            --archive-name "$archive_name" \
            --manifest-name "$manifest_name" \
            --source-root target/release \
            --target "$host" \
            --version "$version" \
            --extract-root "$RUNNER_TEMP/dcc-cua-pr-final-extract-${host}-${GITHUB_RUN_ATTEMPT}" \
            --install-root "$RUNNER_TEMP/dcc-cua-pr-final-install-${host}-${GITHUB_RUN_ATTEMPT}"
