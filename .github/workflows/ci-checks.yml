name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - run: pwsh -NoProfile -File scripts/check-rust-layout.ps1
      - run: pwsh -NoProfile -File scripts/check-agent-skills.ps1
      - run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run
      - run: cargo fmt --all -- --check

  verify:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-3-dev python3-gi gir1.2-gtk-3.0 libx11-dev libxi-dev libxtst-dev
      - if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_runtime="$(cd "$(dirname "$swiftc_path")/../lib/swift/macosx" && pwd)"
          echo "DYLD_LIBRARY_PATH=${swift_runtime}:/usr/lib/swift${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Compile GUI E2E on every target
        run: cargo nextest run --locked -p dcc-cua-e2e --features gui-e2e --no-run

  e2e:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb dbus-x11 at-spi2-core openbox picom libgtk-3-dev python3-gi gir1.2-gtk-3.0 libx11-dev libxi-dev libxtst-dev
      - if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_runtime="$(cd "$(dirname "$swiftc_path")/../lib/swift/macosx" && pwd)"
          echo "DYLD_LIBRARY_PATH=${swift_runtime}:/usr/lib/swift${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p dcc-cua-cli
      - name: Build pinned official CUA driver
        shell: pwsh
        run: ./scripts/build-upstream-cua-driver.ps1
      - name: Run release CLI and Host IPC E2E
        timeout-minutes: 5
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { "target/release/dcc-cua.exe" } else { "target/release/dcc-cua" }
          ./scripts/test-cli-e2e.ps1 -Binary $binary
      - name: Run Windows controlled GUI Host IPC E2E
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/run-gui-e2e.ps1 -Binary target/release/dcc-cua.exe
      - name: Run Linux controlled GUI Host IPC E2E
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -lc \
            'openbox >/tmp/dcc-cua-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/dcc-cua-picom.log 2>&1 & sleep 2; exec pwsh -NoProfile -File scripts/run-gui-e2e.ps1 -Binary target/release/dcc-cua'
      - name: Run macOS controlled GUI Host IPC E2E
        if: matrix.os == 'macos-latest'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/run-gui-e2e.ps1 -Binary target/release/dcc-cua
