name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach artifacts for
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate release configuration
        shell: pwsh
        run: |
          $config = Get-Content release-please-config.json -Raw | ConvertFrom-Json
          $manifest = Get-Content .release-please-manifest.json -Raw | ConvertFrom-Json
          if ($config.'release-type' -ne 'rust') { throw 'release-type must remain rust' }
          if ($config.packages.'crates/dcc-cua-cli'.component -ne 'dcc-cua') { throw 'unexpected release component' }
          if ($manifest.'crates/dcc-cua-cli' -notmatch '^\d+\.\d+\.\d+$') { throw 'manifest version must be valid semver' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: cargo metadata --locked --no-deps --format-version 1

  release-please:
    needs: validate
    if: vars.DCC_CUA_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs['crates/dcc-cua-cli--release_created'] == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
      tag_name: ${{ steps.release.outputs['crates/dcc-cua-cli--tag_name'] || inputs.release_tag }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize Cargo workspace release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs['crates/dcc-cua-cli--version'] }}
        run: |
          $releasePr = $null
          for ($attempt = 0; $attempt -lt 6 -and -not $releasePr; $attempt++) {
              $releasePr = gh pr list --repo $env:GITHUB_REPOSITORY --state open --json number,headRefName,title --limit 10 |
                ConvertFrom-Json |
                Where-Object {
                  $_.title -like 'chore(main): release *' -and
                  $_.headRefName -like 'release-please--branches--main--components--*'
                } |
                Select-Object -First 1
              if (-not $releasePr) { Start-Sleep -Seconds 5 }
          }
          if (-not $releasePr) {
              Write-Host 'No pending release PR; workspace version synchronization is not needed.'
              exit 0
          }

          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
              $version = ($releasePr.title -split ' ')[-1]
          }
          git fetch origin "refs/heads/$($releasePr.headRefName):refs/remotes/origin/$($releasePr.headRefName)"
          git checkout -B $releasePr.headRefName "origin/$($releasePr.headRefName)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          $syncScript = Join-Path $env:RUNNER_TEMP 'sync-cargo-workspace-version.ps1'
          git show 'origin/main:scripts/sync-cargo-workspace-version.ps1' | Set-Content -LiteralPath $syncScript -Encoding utf8
          & pwsh -NoProfile -File $syncScript -Version $version
          if ($LASTEXITCODE -ne 0) { throw "workspace release version sync failed with code $LASTEXITCODE" }
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          if (git diff --cached --quiet) {
              Write-Host 'Workspace release version is already synchronized.'
          } else {
              git commit -m 'chore: synchronize workspace release version'
          }
          git push origin "HEAD:$($releasePr.headRefName)"
          gh workflow run ci-checks.yml --repo $env:GITHUB_REPOSITORY --ref $releasePr.headRefName
          if ($LASTEXITCODE -ne 0) { throw "release PR CI dispatch failed with code $LASTEXITCODE" }

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: zip
          - os: ubuntu-latest
            platform: linux
            archive: tar.gz
          - os: macos-latest
            platform: macos
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libx11-dev libxi-dev libxtst-dev
      - if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_runtime="$(cd "$(dirname "$swiftc_path")/../lib/swift/macosx" && pwd)"
          echo "DYLD_LIBRARY_PATH=${swift_runtime}:/usr/lib/swift${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p dcc-cua-cli
      - name: Package dcc-cua
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="${TAG_NAME#v}"
          mkdir -p dist
          cp -R skills target/release/skills
          cp -R assets target/release/assets
          cp LICENSE target/release/LICENSE
          cp THIRD_PARTY_LICENSES.md target/release/THIRD_PARTY_LICENSES.md
          cp README.md target/release/README.md
          if [ "${{ matrix.archive }}" = "zip" ]; then
            archive="dist/dcc-cua-${version}-${host}.zip"
            (
              cd target/release
              7z a "../../$archive" dcc-cua.exe LICENSE THIRD_PARTY_LICENSES.md README.md assets skills
            )
          else
            archive="dist/dcc-cua-${version}-${host}.tar.gz"
            tar -czf "$archive" -C target/release dcc-cua LICENSE THIRD_PARTY_LICENSES.md README.md assets skills
          fi
          sha256sum "$archive" > "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dcc-cua-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  attach-assets:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dcc-cua-*
          merge-multiple: true
      - name: Attach release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
