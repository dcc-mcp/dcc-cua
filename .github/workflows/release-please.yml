          CHROME_WEBSTORE_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ vars.CHROME_WEBSTORE_EXTENSION_ID }}
          EXTENSION_VERSION: ${{ needs.release-please.outputs.extension_version }}
        run: >-
          python -B scripts/publish_browser_extension.py
          --store chrome
          --artifact "dist/dcc-cua-browser-extension-${EXTENSION_VERSION}-chrome.zip"
          --expected-version "${EXTENSION_VERSION}"

