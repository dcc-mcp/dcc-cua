name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release configuration
        shell: pwsh
        run: |
          $config = Get-Content release-please-config.json -Raw | ConvertFrom-Json
          $manifest = Get-Content .release-please-manifest.json -Raw | ConvertFrom-Json
          if ($config.'release-type' -ne 'simple') { throw 'release-type must use the root release anchor' }
          if ($config.'separate-pull-requests' -ne $true) { throw 'release components must use separate pull requests' }
          if ($config.packages.'.'.component -ne 'dcc-cua') { throw 'unexpected release component' }
          if ($config.packages.'browser-extension/chrome'.component -ne 'dcc-cua-browser-extension') { throw 'unexpected browser extension component' }
          if ($config.packages.'browser-extension/chrome'.'include-component-in-tag' -ne $true) { throw 'browser extension tags must include the component' }
          if ($config.packages.'browser-extension/chrome'.PSObject.Properties.Name -contains 'release-as') { throw 'one-shot release-as overrides must be removed after the initial release' }
          if ($manifest.'.' -notmatch '^\d+\.\d+\.\d+$') { throw 'manifest version must be valid semver' }
          if ($manifest.'browser-extension/chrome' -notmatch '^\d+\.\d+\.\d+$') { throw 'browser extension manifest version must be valid semver' }
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -ne $manifest.'.') { throw 'version anchor must match the release manifest' }
          $extensionPackage = Get-Content browser-extension/chrome/package.json -Raw | ConvertFrom-Json
          $extensionComponent = Get-Content browser-extension/chrome/component-manifest.json -Raw | ConvertFrom-Json
          if ($extensionPackage.version -ne $manifest.'browser-extension/chrome') { throw 'browser package version must match the release manifest' }
          if ($extensionComponent.version -ne $manifest.'browser-extension/chrome') { throw 'browser component version must match the release manifest' }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
        with:
          toolchain: 1.95.0
      - run: cargo metadata --locked --no-deps --format-version 1
      - run: python -B -m unittest scripts.test_release_workflow scripts.test_release_integrity scripts.test_verify_release_assets scripts.test_verify_final_archive scripts.test_verify_uploaded_artifact scripts.test_select_ci_source_sha scripts.test_refresh_release_please_prs

  release-please:
    needs: validate
    if: vars.DCC_CUA_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      source_sha: ${{ steps.release.outputs.sha }}
      extension_release_created: ${{ steps.release.outputs['browser-extension/chrome--release_created'] == 'true' }}
      extension_tag_name: ${{ steps.release.outputs['browser-extension/chrome--tag_name'] }}
      extension_version: ${{ steps.release.outputs['browser-extension/chrome--version'] }}
      extension_source_sha: ${{ steps.release.outputs['browser-extension/chrome--sha'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          fetch-tags: true
      - name: Refuse pre-existing release identities
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}^:.release-please-manifest.json" > "$RUNNER_TEMP/release-manifest-before.json"
          python -B scripts/release_integrity.py changed-tags \
            --before "$RUNNER_TEMP/release-manifest-before.json" \
            --after .release-please-manifest.json \
            > "$RUNNER_TEMP/changed-release-tags.txt"
          published_tags="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[].tag_name'
          )"
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null
            tag_status=$?
            set -e
            case "$tag_status" in
              0)
                echo "release tag $tag already exists" >&2
                exit 1
                ;;
              2)
                ;;
              *)
                echo "cannot verify release tag $tag" >&2
                exit 1
                ;;
            esac
            if grep -Fqx -- "$tag" <<< "$published_tags"; then
              echo "GitHub Release $tag already exists" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/changed-release-tags.txt"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Keep the native runtime release Latest
        if: steps.release.outputs['browser-extension/chrome--release_created'] == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION_TAG: ${{ steps.release.outputs['browser-extension/chrome--tag_name'] }}
        run: |
          $nativeVersion = (Get-Content version.txt -Raw).Trim()
          if ($nativeVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'native runtime version is not valid semver'
          }
          $nativeTag = "v$nativeVersion"
          gh release view $nativeTag --repo "$env:GITHUB_REPOSITORY" --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "native runtime release $nativeTag does not exist" }
          gh release edit $nativeTag --repo "$env:GITHUB_REPOSITORY" --latest
          if ($LASTEXITCODE -ne 0) { throw "cannot mark native runtime release $nativeTag Latest" }
          gh release edit "$env:EXTENSION_TAG" --repo "$env:GITHUB_REPOSITORY" --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'cannot exclude extension release from Latest' }
          $latestJson = gh release view --repo "$env:GITHUB_REPOSITORY" --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'cannot read repository Latest release' }
          $latest = $latestJson | ConvertFrom-Json
          if ($latest.tagName -ne $nativeTag) {
            throw 'repository Latest release is not the native runtime'
          }
      - name: Refresh independent release PRs from current main
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./scripts/refresh-release-please-prs.ps1
          -Repository $env:GITHUB_REPOSITORY

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-26
            platform: macos-aarch64
            target: aarch64-apple-darwin
            archive: tar.gz
            arch: arm64
          - os: macos-26-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            archive: tar.gz
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify native release source binding
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${TAG_NAME}^{commit}")"
          release_target="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          python -B scripts/release_integrity.py verify-source \
            --head-sha "$head_sha" \
            --tag-sha "$tag_sha" \
            --release-target "$release_target" \
            --expected-sha "$EXPECTED_SHA"
      - if: contains(matrix.target, 'apple-darwin')
        uses: ./.github/actions/select-macos-toolchain
        with:
          expected-arch: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
        with:
          toolchain: 1.95.0
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libx11-dev libxi-dev libxtst-dev
      - if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_runtime="$(cd "$(dirname "$swiftc_path")/../lib/swift/macosx" && pwd)"
          echo "DYLD_LIBRARY_PATH=${swift_runtime}:/usr/lib/swift${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p dcc-cua-cli
      - name: Package dcc-cua
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "$EXPECTED_TARGET" ]; then
            echo "runner target $host does not match declared release target $EXPECTED_TARGET" >&2
            exit 1
          fi
          version="${TAG_NAME#v}"
          mkdir -p dist
          cp -R skills target/release/skills
          cp -R assets target/release/assets
          cp -R plugins target/release/plugins
          cp -R .claude-plugin target/release/.claude-plugin
          cp -R .codex-plugin target/release/.codex-plugin
          cp .mcp.json target/release/.mcp.json
          cp LICENSE target/release/LICENSE
          cp THIRD_PARTY_LICENSES.md target/release/THIRD_PARTY_LICENSES.md
          cp README.md target/release/README.md
          cp README.zh-CN.md target/release/README.zh-CN.md
          if [ "${{ matrix.archive }}" = "zip" ]; then
            archive="dist/dcc-cua-${version}-${host}.zip"
            (
              cd target/release
              7z a "../../$archive" dcc-cua.exe LICENSE THIRD_PARTY_LICENSES.md README.md README.zh-CN.md assets skills plugins .claude-plugin .codex-plugin .mcp.json
            )
          else
            archive="dist/dcc-cua-${version}-${host}.tar.gz"
            tar -czf "$archive" -C target/release dcc-cua LICENSE THIRD_PARTY_LICENSES.md README.md README.zh-CN.md assets skills plugins .claude-plugin .codex-plugin .mcp.json
          fi
          asset_name="$(basename "$archive")"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${asset_name}"
          manifest="dist/dcc-cua-install-manifest-${host}.json"
          python scripts/write-install-manifest.py --archive "$archive" --version "$version" --target "$host" --url "$asset_url" --output "$manifest" --checksum-output "${archive}.sha256" --source-root target/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload-native
        with:
          name: dcc-cua-native-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Download exact native artifact by ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload-native.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-native.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_ID" in
            ''|*[!0-9]*) echo "upload did not return a numeric artifact ID" >&2; exit 1 ;;
          esac
          case "$ARTIFACT_DIGEST" in
            *[!0-9a-f]*|'') echo "upload did not return a SHA-256 artifact digest" >&2; exit 1 ;;
          esac
          artifact_download_root="$RUNNER_TEMP/dcc-cua-release-artifact-${ARTIFACT_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$artifact_download_root"
          artifact_metadata="$artifact_download_root/metadata.json"
          artifact_repository_metadata="$artifact_download_root/repository.json"
          artifact_bundle="$artifact_download_root/artifact.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "$artifact_metadata"
          gh api "repos/${GITHUB_REPOSITORY}" > "$artifact_repository_metadata"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$artifact_bundle"
          printf 'ARTIFACT_METADATA=%s\nARTIFACT_REPOSITORY_METADATA=%s\nARTIFACT_BUNDLE=%s\n' \
            "$artifact_metadata" "$artifact_repository_metadata" "$artifact_bundle" >> "$GITHUB_ENV"
      - name: Verify downloaded immutable native artifact
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          EXPECTED_TARGET: ${{ matrix.target }}
          ARCHIVE_TYPE: ${{ matrix.archive }}
          ARTIFACT_ID: ${{ steps.upload-native.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-native.outputs.artifact-digest }}
          EXPECTED_HEAD_SHA: ${{ needs.release-please.outputs.source_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_HEAD_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "$EXPECTED_TARGET" ]; then
            echo "runner target $host does not match declared release target $EXPECTED_TARGET" >&2
            exit 1
          fi
          if [ "$ARCHIVE_TYPE" = "zip" ]; then
            archive_name="dcc-cua-${version}-${host}.zip"
          else
            archive_name="dcc-cua-${version}-${host}.tar.gz"
          fi
          manifest_name="dcc-cua-install-manifest-${host}.json"
          python -B scripts/verify_uploaded_artifact.py \
            --metadata "$ARTIFACT_METADATA" \
            --repository-metadata "$ARTIFACT_REPOSITORY_METADATA" \
            --bundle "$ARTIFACT_BUNDLE" \
            --output-root "$RUNNER_TEMP/dcc-cua-release-readback-${ARTIFACT_ID}" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "dcc-cua-native-${{ matrix.platform }}" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$EXPECTED_HEAD_SHA" \
            --repository-id "$EXPECTED_REPOSITORY_ID" \
            --head-repository-id "$EXPECTED_HEAD_REPOSITORY_ID" \
            --archive-name "$archive_name" \
            --manifest-name "$manifest_name" \
            --source-root target/release \
            --target "$host" \
            --version "$version" \
            --extract-root "$RUNNER_TEMP/dcc-cua-final-extract-${host}-${GITHUB_RUN_ATTEMPT}" \
            --install-root "$RUNNER_TEMP/dcc-cua-final-install-${host}-${GITHUB_RUN_ATTEMPT}"

  consolidate-native:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-release.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-release.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
      - name: Verify native build artifact set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/native-build-artifacts.json"
          python -B scripts/release_integrity.py write-native-plan \
            --metadata "$RUNNER_TEMP/native-build-artifacts.json" \
            --expected-run-id "$RUN_ID" \
            --expected-head-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/native-build-plan.json"
      - name: Download and verify native build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-build-transports"
          while IFS=$'\t' read -r artifact_id artifact_digest; do
            archive="$RUNNER_TEMP/native-build-transports/${artifact_id}.zip"
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$archive"
            python -B scripts/release_integrity.py verify-extract \
              --archive "$archive" \
              --expected-digest "$artifact_digest" \
              --output dist
          done < <(
            jq -r '.[] | [.id, .sha256] | @tsv' \
              "$RUNNER_TEMP/native-build-plan.json"
          )
      - name: Write immutable native release provenance
        env:
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          python -B scripts/release_integrity.py write-provenance \
            --directory dist \
            --version "$version" \
            --tag "$TAG_NAME" \
            --source-sha "$SOURCE_SHA" \
            --release-target-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-artifacts "$RUNNER_TEMP/native-build-artifacts.json" \
            --output "dist/dcc-cua-release-provenance-v1.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload-release
        with:
          name: dcc-cua-native-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attach-assets:
    needs: [release-please, consolidate-native]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
      - name: Verify immutable native artifact identity
        env:
          ARTIFACT_ID: ${{ needs.consolidate-native.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.consolidate-native.outputs.artifact_digest }}
          EXPECTED_HEAD_SHA: ${{ needs.release-please.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          python -B scripts/release_integrity.py verify-artifact \
            --metadata "$RUNNER_TEMP/artifact.json" \
            --expected-id "$ARTIFACT_ID" \
            --expected-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --expected-name dcc-cua-native-release \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$EXPECTED_HEAD_SHA"
      - name: Audit immutable native artifact download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.consolidate-native.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-action-download-audit
      - name: Download and extract verified native artifact
        env:
          ARTIFACT_ID: ${{ needs.consolidate-native.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.consolidate-native.outputs.artifact_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/native-release-artifact.zip"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$archive"
          python -B scripts/release_integrity.py verify-extract \
            --archive "$archive" \
            --expected-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --output dist
      - name: Verify native release asset completeness and provenance
        env:
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/release_integrity.py verify-provenance \
            --directory dist \
            --version "${TAG_NAME#v}" \
            --tag "$TAG_NAME" \
            --source-sha "$SOURCE_SHA" \
            --release-target-sha "$SOURCE_SHA" \
            --provenance dist/dcc-cua-release-provenance-v1.json
      - name: Refuse existing native release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          asset_count="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [ "$asset_count" -ne 0 ]; then
            echo "native release already contains assets" >&2
            exit 1
          fi
      - name: Attach release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY"
      - name: Verify published native release immutability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,assets \
            > "$RUNNER_TEMP/published-native-release.json"
          latest_tag="$(
            gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName --jq .tagName
          )"
          python -B scripts/release_integrity.py verify-published-native \
            --metadata "$RUNNER_TEMP/published-native-release.json" \
            --directory dist \
            --version "${TAG_NAME#v}" \
            --tag "$TAG_NAME" \
            --source-sha "$SOURCE_SHA" \
            --actual-latest-tag "$latest_tag"

  package-browser-extension:
    needs: release-please
    if: needs.release-please.outputs.extension_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-extension.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-extension.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.extension_source_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify browser extension release source binding
        env:
          EXPECTED_SHA: ${{ needs.release-please.outputs.extension_source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.extension_tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${TAG_NAME}^{commit}")"
          release_target="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          python -B scripts/release_integrity.py verify-source \
            --head-sha "$head_sha" \
            --tag-sha "$tag_sha" \
            --release-target "$release_target" \
            --expected-sha "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/chrome/package-lock.json
      - run: npm --prefix browser-extension/chrome ci
      - run: npm --prefix browser-extension/chrome run check
      - run: npm --prefix browser-extension/chrome test
      - run: npm --prefix browser-extension/chrome run build
      - run: python -B browser-extension/chrome/scripts/test_extension.py
      - name: Package browser extensions
        env:
          EXTENSION_VERSION: ${{ needs.release-please.outputs.extension_version }}
        shell: bash
        run: |
          set -euo pipefail
          for browser in chrome edge firefox; do
            python -B browser-extension/chrome/scripts/package_extension.py \
              --browser "$browser" \
              --output "dist/dcc-cua-browser-extension-${EXTENSION_VERSION}-${browser}.zip" \
              --version "${EXTENSION_VERSION}"
          done
          rm -- dist/*.sha256
          (
            cd browser-extension/chrome
            npx --no-install wxt zip -b firefox --mv3 --sources
            cp .output/*-sources.zip \
              "../../dist/dcc-cua-browser-extension-${EXTENSION_VERSION}-firefox-sources.zip"
          )
      - name: Verify browser extension asset set
        env:
          EXTENSION_VERSION: ${{ needs.release-please.outputs.extension_version }}
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/release_integrity.py verify-extension-assets \
            --directory dist \
            --version "$EXTENSION_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload-extension
        with:
          name: dcc-cua-browser-extension
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attach-browser-extension-assets:
    needs: [release-please, package-browser-extension]
    if: needs.release-please.outputs.extension_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.extension_source_sha }}
      - name: Verify immutable browser extension artifact identity
        env:
          ARTIFACT_ID: ${{ needs.package-browser-extension.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.package-browser-extension.outputs.artifact_digest }}
          EXPECTED_HEAD_SHA: ${{ needs.release-please.outputs.extension_source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          python -B scripts/release_integrity.py verify-artifact \
            --metadata "$RUNNER_TEMP/artifact.json" \
            --expected-id "$ARTIFACT_ID" \
            --expected-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --expected-name dcc-cua-browser-extension \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$EXPECTED_HEAD_SHA"
      - name: Audit immutable browser extension artifact download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package-browser-extension.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/extension-action-download-audit
      - name: Download and extract verified browser extension artifact
        env:
          ARTIFACT_ID: ${{ needs.package-browser-extension.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.package-browser-extension.outputs.artifact_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/browser-extension-artifact.zip"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$archive"
          python -B scripts/release_integrity.py verify-extract \
            --archive "$archive" \
            --expected-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --output dist
      - name: Verify browser extension asset set
        env:
          EXTENSION_VERSION: ${{ needs.release-please.outputs.extension_version }}
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/release_integrity.py verify-extension-assets \
            --directory dist \
            --version "$EXTENSION_VERSION"
      - name: Refuse existing browser extension release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.extension_tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          asset_count="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [ "$asset_count" -ne 0 ]; then
            echo "browser extension release already contains assets" >&2
            exit 1
          fi
      - name: Attach browser extension review artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.extension_tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY"
      - name: Verify published browser extension release immutability
        env:
          EXTENSION_VERSION: ${{ needs.release-please.outputs.extension_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.release-please.outputs.extension_source_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.extension_tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,assets \
            > "$RUNNER_TEMP/published-extension-release.json"
          latest_tag="$(
            gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName --jq .tagName
          )"
          native_tag="v$(tr -d '\r\n' < version.txt)"
          python -B scripts/release_integrity.py verify-published-extension \
            --metadata "$RUNNER_TEMP/published-extension-release.json" \
            --directory dist \
            --version "$EXTENSION_VERSION" \
            --tag "$TAG_NAME" \
            --source-sha "$SOURCE_SHA" \
            --expected-latest-tag "$native_tag" \
            --actual-latest-tag "$latest_tag"

