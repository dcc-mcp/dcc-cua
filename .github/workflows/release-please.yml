name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach artifacts for
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate release configuration
        shell: pwsh
        run: |
          $config = Get-Content release-please-config.json -Raw | ConvertFrom-Json
          $manifest = Get-Content .release-please-manifest.json -Raw | ConvertFrom-Json
          if ($config.'release-type' -ne 'simple') { throw 'release-type must use the root release anchor' }
          if ($config.'separate-pull-requests' -ne $true) { throw 'release components must use separate pull requests' }
          if ($config.packages.'.'.component -ne 'dcc-cua') { throw 'unexpected release component' }
          if ($config.packages.'browser-extension/chrome'.component -ne 'dcc-cua-browser-extension') { throw 'unexpected browser extension component' }
          if ($config.packages.'browser-extension/chrome'.'include-component-in-tag' -ne $true) { throw 'browser extension tags must include the component' }
          if ($config.packages.'browser-extension/chrome'.PSObject.Properties.Name -contains 'release-as') { throw 'one-shot release-as overrides must be removed after the initial release' }
          if ($manifest.'.' -notmatch '^\d+\.\d+\.\d+$') { throw 'manifest version must be valid semver' }
          if ($manifest.'browser-extension/chrome' -notmatch '^\d+\.\d+\.\d+$') { throw 'browser extension manifest version must be valid semver' }
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -ne $manifest.'.') { throw 'version anchor must match the release manifest' }
          $extensionPackage = Get-Content browser-extension/chrome/package.json -Raw | ConvertFrom-Json
          $extensionComponent = Get-Content browser-extension/chrome/component-manifest.json -Raw | ConvertFrom-Json
          if ($extensionPackage.version -ne $manifest.'browser-extension/chrome') { throw 'browser package version must match the release manifest' }
          if ($extensionComponent.version -ne $manifest.'browser-extension/chrome') { throw 'browser component version must match the release manifest' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: cargo metadata --locked --no-deps --format-version 1
      - run: python -B -m unittest scripts.test_release_workflow

  release-please:
    needs: validate
    if: vars.DCC_CUA_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.release_tag }}
      extension_release_created: ${{ steps.release.outputs['browser-extension/chrome--release_created'] == 'true' }}
      extension_tag_name: ${{ steps.release.outputs['browser-extension/chrome--tag_name'] }}
      extension_version: ${{ steps.release.outputs['browser-extension/chrome--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh independent release PRs from current main
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./scripts/refresh-release-please-prs.ps1
          -Repository $env:GITHUB_REPOSITORY

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: zip
          - os: ubuntu-latest
            platform: linux
            archive: tar.gz
          - os: macos-latest
            platform: macos
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libx11-dev libxi-dev libxtst-dev
      - if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_runtime="$(cd "$(dirname "$swiftc_path")/../lib/swift/macosx" && pwd)"
          echo "DYLD_LIBRARY_PATH=${swift_runtime}:/usr/lib/swift${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p dcc-cua-cli
      - name: Package dcc-cua
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="${TAG_NAME#v}"
          mkdir -p dist
          cp -R skills target/release/skills
          cp -R assets target/release/assets
          cp -R .claude-plugin target/release/.claude-plugin
          cp -R .codex-plugin target/release/.codex-plugin
          cp .mcp.json target/release/.mcp.json
          cp LICENSE target/release/LICENSE
          cp THIRD_PARTY_LICENSES.md target/release/THIRD_PARTY_LICENSES.md
          cp README.md target/release/README.md
          cp README.zh-CN.md target/release/README.zh-CN.md
          if [ "${{ matrix.archive }}" = "zip" ]; then
            archive="dist/dcc-cua-${version}-${host}.zip"
            (
              cd target/release
              7z a "../../$archive" dcc-cua.exe LICENSE THIRD_PARTY_LICENSES.md README.md README.zh-CN.md assets skills .claude-plugin .codex-plugin .mcp.json
            )
          else
            archive="dist/dcc-cua-${version}-${host}.tar.gz"
            tar -czf "$archive" -C target/release dcc-cua LICENSE THIRD_PARTY_LICENSES.md README.md README.zh-CN.md assets skills .claude-plugin .codex-plugin .mcp.json
          fi
          asset_name="$(basename "$archive")"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${asset_name}"
          manifest="dist/dcc-cua-install-manifest-${host}.json"
          python scripts/write-install-manifest.py --archive "$archive" --version "$version" --target "$host" --url "$asset_url" --output "$manifest" --checksum-output "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dcc-cua-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  attach-assets:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dcc-cua-*
          merge-multiple: true
      - name: Attach release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  package-browser-extension:
    needs: release-please
    if: needs.release-please.outputs.extension_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/chrome/package-lock.json
      - run: npm --prefix browser-extension/chrome ci
      - run: npm --prefix browser-extension/chrome run check
      - run: npm --prefix browser-extension/chrome test
      - run: npm --prefix browser-extension/chrome run build
      - run: python -B browser-extension/chrome/scripts/test_extension.py
      - name: Package browser extensions
        env:
          EXTENSION_VERSION: ${{ needs.release-please.outputs.extension_version }}
        shell: bash
        run: |
          set -euo pipefail
          for browser in chrome edge firefox; do
            python -B browser-extension/chrome/scripts/package_extension.py \
              --browser "$browser" \
              --output "dist/dcc-cua-browser-extension-${EXTENSION_VERSION}-${browser}.zip" \
              --version "${EXTENSION_VERSION}"
          done
          (
            cd browser-extension/chrome
            npx --no-install wxt zip -b firefox --mv3 --sources
            cp .output/*-sources.zip \
              "../../dist/dcc-cua-browser-extension-${EXTENSION_VERSION}-firefox-sources.zip"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: dcc-cua-browser-extension
          path: dist/*
          if-no-files-found: error

  attach-browser-extension-assets:
    needs: [release-please, package-browser-extension]
    if: needs.release-please.outputs.extension_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dcc-cua-browser-extension
          path: dist
      - name: Attach browser extension review artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.extension_tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-chrome-web-store:
    needs: [release-please, package-browser-extension]
    if: needs.release-please.outputs.extension_release_created == 'true' && vars.DCC_CUA_BROWSER_STORE_PUBLISH_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}
      - uses: actions/download-artifact@v4
        with:
          name: dcc-cua-browser-extension
          path: dist
      - uses: google-github-actions/auth@v3
        id: google-auth
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.CHROME_WEBSTORE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_WEBSTORE_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Submit Chrome Web Store release
        env:
          CHROME_WEBSTORE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ vars.CHROME_WEBSTORE_EXTENSION_ID }}
          EXTENSION_VERSION: ${{ needs.release-please.outputs.extension_version }}
        run: >-
          python -B scripts/publish_browser_extension.py
          --store chrome
          --artifact "dist/dcc-cua-browser-extension-${EXTENSION_VERSION}-chrome.zip"
          --expected-version "${EXTENSION_VERSION}"

  publish-edge-addons:
    needs: [release-please, package-browser-extension]
    if: needs.release-please.outputs.extension_release_created == 'true' && vars.DCC_CUA_BROWSER_STORE_PUBLISH_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}
      - uses: actions/download-artifact@v4
        with:
          name: dcc-cua-browser-extension
          path: dist
      - name: Submit Edge Add-ons release
        env:
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_CLIENT_ID: ${{ vars.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_PRODUCT_ID: ${{ vars.EDGE_ADDONS_PRODUCT_ID }}
          EXTENSION_VERSION: ${{ needs.release-please.outputs.extension_version }}
        run: >-
          python -B scripts/publish_browser_extension.py
          --store edge
          --artifact "dist/dcc-cua-browser-extension-${EXTENSION_VERSION}-edge.zip"
          --expected-version "${EXTENSION_VERSION}"

  publish-firefox-addons:
    needs: [release-please, package-browser-extension]
    if: needs.release-please.outputs.extension_release_created == 'true' && vars.DCC_CUA_BROWSER_STORE_PUBLISH_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.extension_tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/chrome/package-lock.json
      - run: npm --prefix browser-extension/chrome ci
      - uses: actions/download-artifact@v4
        with:
          name: dcc-cua-browser-extension
          path: dist
      - name: Submit Firefox Add-ons release
        working-directory: browser-extension/chrome
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_AMO_API_KEY }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_AMO_API_SECRET }}
          FIREFOX_CHANNEL: listed
          FIREFOX_ZIP: ${{ github.workspace }}/dist/dcc-cua-browser-extension-${{ needs.release-please.outputs.extension_version }}-firefox.zip
          FIREFOX_SOURCES_ZIP: ${{ github.workspace }}/dist/dcc-cua-browser-extension-${{ needs.release-please.outputs.extension_version }}-firefox-sources.zip
        run: npx --no-install wxt submit
