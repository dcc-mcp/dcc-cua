name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libx11-dev libxi-dev libxtst-dev
      - if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_runtime="$(cd "$(dirname "$swiftc_path")/../lib/swift/macosx" && pwd)"
          echo "DYLD_LIBRARY_PATH=${swift_runtime}:/usr/lib/swift${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: pwsh -NoProfile -File scripts/check-rust-layout.ps1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo build --release --locked -p dcc-mcp-cua-cli
