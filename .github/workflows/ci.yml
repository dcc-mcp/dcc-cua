name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libx11-dev libxi-dev libxtst-dev
      - if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_lib="$(find "$(xcrun --show-sdk-path)/usr/lib/swift" "$(dirname "$swiftc_path")/../lib/swift" -name libswift_Concurrency.dylib -print -quit 2>/dev/null)"
          test -n "$swift_lib"
          echo "DYLD_LIBRARY_PATH=$(dirname "$swift_lib")" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test --all-targets
