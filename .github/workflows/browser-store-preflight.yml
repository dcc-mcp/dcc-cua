name: Browser store credential preflight

on:
  workflow_dispatch:

permissions: {}

jobs:
  chrome-web-store:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: browser-stores
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        id: google-auth
        with:
          create_credentials_file: false
          export_environment_variables: false
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          workload_identity_provider: ${{ vars.CHROME_WEBSTORE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_WEBSTORE_SERVICE_ACCOUNT }}
      - name: Verify short-lived Chrome Web Store token
        shell: python
        env:
          CHROME_WEBSTORE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          import os

          if not os.environ.get("CHROME_WEBSTORE_ACCESS_TOKEN", "").strip():
              raise SystemExit("Chrome Web Store access token was not generated")
          print("Chrome Web Store credential preflight succeeded")
