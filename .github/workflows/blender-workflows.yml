name: Blender workflows
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'examples/blender-*.json'
      - 'scripts/*blender*'
      - 'scripts/fixtures/blender_scene_readback.py'
      - '.github/workflows/blender-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-workflows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 openbox wmctrl libgtk-3-dev libxi-dev libxtst-dev libgl1-mesa-dri
      - name: Install software OpenGL for the disposable Windows Blender process
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:/msys64/usr/bin/bash.exe -lc 'pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-mesa'
      - run: cargo build --release --locked -p dcc-cua-cli
      - name: Verify mesh extrusion and armature keyframes
        shell: bash
        timeout-minutes: 10
        run: bash scripts/ci_blender_workflows.sh
      - name: Upload measurements
        if: "!cancelled()"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blender-workflows-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/blender-workflows.json
          if-no-files-found: warn
          retention-days: 5
